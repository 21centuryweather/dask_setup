[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dask_setup"
version = "2.3.0"
description = "HPC-tuned Dask helpers for single-node runs on NCI Gadi."
authors = [{name="Sam Green"}]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "dask>=2024.1.0",
    "distributed>=2024.1.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/21centuryweather/dask_setup"
Documentation = "https://21centuryweather.github.io/dask_setup/"
Changelog = "https://github.com/21centuryweather/dask_setup/blob/main/CHANGELOG.md"

[project.scripts]
dask-setup = "dask_setup.cli:main"

[project.optional-dependencies]
# Multi-node PBS/SLURM cluster support. Optional: the single-node path never
# imports it, and setup_pbs_cluster()/setup_slurm_cluster() raise a helpful
# ImportError if it is missing.
multinode = [
    "dask-jobqueue>=0.8",
]

dev = [
    # Pinned exactly, not a range. `ruff ~= 0.4` means >=0.4,<1.0, so CI picked
    # up whatever ruff had released that morning -- and ruff's formatter changes
    # between minor versions. That turns `ruff format --check` into a job that
    # can fail on a commit that touched nothing. Bump this deliberately.
    "ruff == 0.16.4",
    "pytest ~= 8.2",
    "pytest-cov ~= 5.0",
    # Xarray integration testing
    "xarray",
    "numpy",
    # Multi-node tests exercise a real PBSJob. Without this, CI silently skipped
    # the multi-node path -- including the regression test for the 4x worker
    # under-provisioning fixed in 2.2.0.
    "dask-jobqueue>=0.8",
]

# Documentation site (docs/, published to GitHub Pages by .github/workflows/docs.yml).
# Install alongside dev: the API reference imports xarray and dask-jobqueue.
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=3",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "ipykernel",
    # The example notebooks are executed during the build.
    "pandas",
    "scipy",
    "matplotlib",
    "netcdf4",
    "h5netcdf",
    # zarr 3: current xarray no longer writes through zarr 2. rechunker is left
    # out on purpose -- it pins zarr<3, and rechunk_dataset() falls back to
    # native xarray without it.
    "zarr>=3",
]

[tool.setuptools.package-data]
dask_setup = ["py.typed", "schema/profile_schema.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
include = ["*.py"]

[tool.ruff.lint]
# Rule selection: common scientific/typing sets
select = ["E", "F", "I", "UP", "S", "B", "C4", "SIM", "NPY", "RUF100"]
ignore = [
    "E501",  # line-length handled by formatter
    "S101",  # Use of assert detected - allow in tests
    "S108",  # Probable insecure usage of temporary file - expected in HPC context
]

[tool.pytest.ini_options]
addopts = """
    -ra
    --strict-markers
    --strict-config
    --cov=dask_setup
    --cov-branch
    --cov-report=term-missing
    --cov-report=html
"""
pythonpath = ["src"]
minversion = "6.0"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests (deselect with '-m \"not unit\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
