# Example dask_setup profile for CPU-intensive workloads.
#
# Settings live under `config:`. A profile with its settings at the top level
# loads without error, but every setting is ignored and the defaults are used.
#
# Load it with:
#   ConfigManager().load_profile_from_file("cpu_profile.yaml")
# or copy it to ~/.dask_setup/profiles/ and use setup_dask_client(profile="cpu_intensive").
#
# This profile suits CPU-bound work that benefits from:
#   - Many single-threaded workers (sidesteps the GIL)
#   - Spill compression ("auto" uses lz4 when the lz4 package is installed)
#   - A large memory reservation for OS/filesystem caches
#
# Best for: NumPy maths, reductions, xarray computations, NetCDF/HDF5 input
# Avoid for: Zarr or cloud object storage (use workload_type "io"), small quick tasks

name: "cpu_intensive"
version: "1.7"

config:
  description: "Heavy computation workload optimized for mathematical operations"
  workload_type: "cpu"
  max_workers: null  # Use all available cores
  reserve_mem_gb: 60.0
  max_mem_gb: null
  dashboard: true
  adaptive: false
  min_workers: null
  suggest_chunks: true

  # Advanced memory management
  memory_target: 0.75
  memory_spill: 0.85
  memory_pause: 0.92
  memory_terminate: 0.98

  # Compression settings
  # "lz4" is faster but crashes workers at startup unless `pip install lz4` has
  # been done; "auto" picks lz4, then snappy, then none, whichever is installed.
  spill_compression: "auto"
  comm_compression: false

  # Tags for organization
  tags:
    - "cpu-heavy"
    - "mathematical"
    - "scientific"
    - "single-threaded"
